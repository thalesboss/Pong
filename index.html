<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo Pong em HTML5</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid white;
        }
    </style>
</head>
<body>

<canvas id="pong" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext("2d");

    // Configuração da bola
    let ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 10,
        speed: 4,
        velocityX: 4,
        velocityY: 4
    };

    // Raquete do jogador
    let player = {
        x: 10,
        y: canvas.height / 2 - 40,
        width: 10,
        height: 80,
        score: 0
    };

    // Raquete do oponente
    let ai = {
        x: canvas.width - 20,
        y: canvas.height / 2 - 40,
        width: 10,
        height: 80,
        score: 0
    };

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
    }

    function drawCircle(x, y, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.fill();
    }

    function render() {
        // Limpa a tela
        drawRect(0, 0, canvas.width, canvas.height, "#111");
        // Desenha as raquetes e a bola
        drawRect(player.x, player.y, player.width, player.height, "WHITE");
        drawRect(ai.x, ai.y, ai.width, ai.height, "WHITE");
        drawCircle(ball.x, ball.y, ball.radius, "WHITE");
    }

    function update() {
        ball.x += ball.velocityX;
        ball.y += ball.velocityY;

        // Simples IA para mover a segunda raquete
        ai.y += (ball.y - (ai.y + ai.height / 2)) * 0.08;

        // Rebater nas paredes superior e inferior
        if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
            ball.velocityY = -ball.velocityY;
        }

        // Colisão com as raquetes
        let activePaddle = (ball.x < canvas.width / 2) ? player : ai;
        if (ball.x - ball.radius < activePaddle.x + activePaddle.width &&
            ball.x + ball.radius > activePaddle.x &&
            ball.y > activePaddle.y && ball.y < activePaddle.y + activePaddle.height) {
            ball.velocityX = -ball.velocityX;
        }
    }

    function gameLoop() {
        update();
        render();
    }

    // Controle da raquete com o mouse
    canvas.addEventListener("mousemove", function(evt) {
        let rect = canvas.getBoundingClientRect();
        player.y = evt.clientY - rect.top - player.height / 2;
    });

    // Atualiza o jogo 60 vezes por segundo
    setInterval(gameLoop, 1000 / 60);
</script>

</body>
</html>
